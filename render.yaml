services:
  - type: web
    name: refund-item-classification
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MODEL_PATH
        value: "saved_model/product_classifier.pkl"
      - key: LABELS_PATH
        value: "saved_model/labels.json"
      - key: IMAGE_DIR
        value: "model_data/fashion_products/images"
      - key: RESULTS_DIR
        value: "results"
    plan: free